name: release-please
on:
  push:
    branches: [main]

# Kept on the caller: a called workflow never holds more permissions than the calling one, so
# dropping these would leave release-please unable to open or update its release pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.5.0

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.5.0
    with:
      java-version: "25.0.3"
      java-distribution: "temurin"
    secrets: inherit
